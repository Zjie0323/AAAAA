# ============================================================
#  A股实时看板 · 部署配置（唯一配置源）
#  所有启停脚本均 source 本文件，改这里即可，不要改脚本内部
# ============================================================

# 服务名（systemd unit 名 / PID 文件名前缀），不带空格
APP_NAME="astock-realtime"

# 部署根目录：安装脚本会把 app/ 复制到 $INSTALL_DIR，日志写到 $LOG_DIR
INSTALL_DIR="/opt/astock-realtime"
LOG_DIR="/var/log/astock-realtime"

# 监听端口（唯一需要关心的项）
#   改这一个值即可，脚本与 systemd 单元会自动同步。
#   改完必须重跑: sudo ./install.sh      或    sudo ./scripts/ctl-port.sh <新端口>
SERVE_PORT=8000

# 监听地址（仅供展示/记录，实际不生效）
#   server.py 内部硬编码监听 0.0.0.0（即所有网卡），此处改任何值都不会改变绑定行为。
#   如需限制来源 IP，请在防火墙层做，而不是改这里 —— 见 README 第五节。
SERVE_HOST="0.0.0.0"

# Python 解释器：留空则自动探测（python3 -> python -> py -3）
#   CentOS 7 自带 python2，若未装 python3 请先: yum install -y python3
PYTHON_BIN=""

# 运行用户与用户组（建议非 root，降低风险）
#   安装脚本会自动创建该用户（不可登录的系统账号）
RUN_USER="astock"
RUN_GROUP="astock"

# 优雅停止等待秒数（超过则 SIGKILL）
STOP_TIMEOUT=10

# 健康检查超时秒数
HEALTH_TIMEOUT=5
